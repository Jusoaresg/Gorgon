{{ define "add-show" }}
<form>
    <div class="add-show-container">
        <div class="search-section">
            <h1>Find Series</h1>

            <div class="search-main">
                <div class="search-input-wrapper">
                    <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted);"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input
                        id="search-input"
                        name="name"
                        type="text"
                        placeholder="Search TVMaze..."
                    >
                </div>
                <button
                    hx-post="/front/search-show"
                    hx-include="#search-input"
                    hx-target="#card-grid"
                    class="btn btn-search"
                >Search</button>
            </div>
        </div>

        <div id="card-grid" class="search-results-grid">

            <!-- Result Cards -->
            <!-- template add-show-card -->

        </div>
    </div>
</form>
{{ end }}
