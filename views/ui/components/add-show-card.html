{{ define "add-show-card" }}
    {{ range .Shows }}
        {{ if .IsAdded }}
            <a href="#" class="result-card" style="cursor: default;">
        {{ else }}
            <a href="/add-show/{{ .Show.TvMazeID }}/config" class="result-card">
        {{ end }}
                <div class="result-poster">
                    <img src="{{ .Show.Image.Medium }}" alt="Poster">
                    <div class="result-overlay">
                        {{ if .IsAdded }}
                             <span class="btn btn-add-small" style="background-color: var(--success); cursor: default;">In Library</span>
                        {{ else }}
                             <span class="btn btn-add-small">Add Series</span>
                        {{ end }}
                    </div>
                </div>
                <div class="result-content">
                    <div class="result-network">HBO</div>
                    <h4 class="result-title">{{ .Show.Name }}</h4>
                    <div class="result-meta">
                        <span>{{ .Show.Premiered }}</span>
                        <span>•</span>
                        <span class="text-success">{{ .Show.Status }}</span>
                    </div>
                    <p class="result-summary">{{ .Show.Summary }}</p>
                </div>
            </a>
    {{ end }}
{{ end }}
