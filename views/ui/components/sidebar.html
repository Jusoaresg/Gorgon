{{ define "sidebar" }}
<div class="mobile-menu-toggle">
    <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
</div>

            <!--         <span>Calendar</span> -->
            <!--     </a> -->
            <!-- </li> -->
