basePath: /api/v1
definitions:
  schema.AddNewTorrentRequest:
    properties:
      magneticUrl:
        type: string
    type: object
  schema.ChangeEpisodeTrackingRequest:
    properties:
      episode_id:
        type: integer
      tracking:
        type: string
    type: object
  schema.CheckTorrentResponse:
    properties:
      completed:
        type: integer
      completedon:
        type: integer
      contentpath:
        type: string
      dlspeed:
        type: integer
      eta:
        type: integer
      hash:
        type: string
      name:
        type: string
      num_leechs:
        type: integer
      num_seeds:
        type: integer
      progress:
        type: number
      save_path:
        type: string
      state:
        type: string
      time_active:
        type: integer
      upspeed:
        type: integer
    type: object
  schema.IndexerResponse:
    properties:
      definitionName:
        type: string
      enable:
        type: boolean
      id:
        type: integer
      indexerUrls:
        items:
          type: string
        type: array
      language:
        type: string
      name:
        type: string
    type: object
  schema.SearchRequest:
    properties:
      query:
        type: string
    type: object
  schema.SearchResponse:
    properties:
      age:
        type: number
      ageHours:
        type: number
      ageMinutes:
        type: number
      fileName:
        type: string
      grabs:
        type: integer
      guid:
        type: string
      indexer:
        type: string
      indexerId:
        type: integer
      infoHash:
        type: string
      infoUrl:
        type: string
      leechers:
        type: integer
      magnetUrl:
        type: string
      protocol:
        type: string
      publishDate:
        type: string
      seeders:
        type: integer
      size:
        type: integer
      title:
        type: string
    type: object
  schemas.ConfigFile:
    properties:
      defaultShowInfoFolder:
        type: string
      prowlarrApiKey:
        type: string
      prowlarrHost:
        type: string
      prowlarrPort:
        type: string
      qBittorrentDownloadFolder:
        type: string
      qBittorrentHost:
        type: string
      qBittorrentPassword:
        type: string
      qBittorrentPort:
        type: string
      qBittorrentUsername:
        type: string
      showsFolder:
        type: string
    type: object
  schemas.DefaultResponse:
    properties:
      data: {}
      message:
        type: string
    type: object
  schemas.ErrorResponse:
    properties:
      errorCode:
        type: string
      message:
        type: string
    type: object
  schemas.IdRequest:
    properties:
      id:
        type: integer
    type: object
  schemas.NameRequest:
    properties:
      name:
        type: string
    type: object
  show.AddShowToListRequest:
    properties:
      id:
        type: integer
      tracking_type:
        type: string
    type: object
info:
  contact:
    email: julianosgreg@gmail.com
    name: Jusoares
  description: Show Download Manager API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Gongon
  version: "0.1"
paths:
  /app/config:
    get:
      description: Get Gorgon Application Config
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Get App Config
      tags:
      - App/Config
    post:
      description: Update Gorgon Application Config
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.ConfigFile'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Update App Config
      tags:
      - App/Config
  /database/indexer:
    delete:
      description: Delete Indexer from db
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.IdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Delete Indexer
      tags:
      - Database/Indexer
    get:
      description: List all added indexers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: List Indexers
      tags:
      - Database/Indexer
    post:
      consumes:
      - application/json
      description: Add Indexer to db
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.IdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Add Indexer
      tags:
      - Database/Indexer
  /database/indexer/{id}:
    get:
      description: Get indexer
      parameters:
      - description: Indexer identification
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Get Indexer
      tags:
      - Database/Indexer
  /database/show:
    delete:
      description: Delete Show from list
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.IdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Delete Show
      tags:
      - Database/Show
    get:
      description: List all shows
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: List Shows
      tags:
      - Database/Show
    post:
      consumes:
      - application/json
      description: Add Show to List, tracking must be "all", "future", or "none"
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/show.AddShowToListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Add Show
      tags:
      - Database/Show
  /database/show/{id}:
    get:
      description: Getshow
      parameters:
      - description: Show ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Get Show
      tags:
      - Database/Show
  /database/show/episode/{id}:
    delete:
      description: Delete Downloaded Episode
      parameters:
      - description: Episode ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Delete Downloaded Episode
      tags:
      - Database/Episodes
    get:
      description: List Show Episodes
      parameters:
      - description: Show ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: List Show Episodes
      tags:
      - Database/Episodes
  /database/show/episode/status:
    post:
      description: Change Episode Tracking Status
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schema.ChangeEpisodeTrackingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Change Episode Status
      tags:
      - Database/Show/Episode
  /database/show/seasons/{id}:
    get:
      description: List Show Seasons
      parameters:
      - description: Show ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: List Show Seasons
      tags:
      - Database/Seasons
  /prowlarr/indexer:
    get:
      consumes:
      - application/json
      description: Get All Prowlarr indexers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/schema.IndexerResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Get All Indexer
      tags:
      - Prowlarr/Indexer
  /prowlarr/search:
    post:
      description: Search shows on prowlarr indexers
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schema.SearchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/schema.SearchResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Search For Shows
      tags:
      - Prowlarr/Search
  /prowlarr/search/episode:
    post:
      description: Search show episodes on prowlarr indexers
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.IdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/schema.SearchResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Search For Show Episodes
      tags:
      - Prowlarr/Search
  /qbittorrent/add:
    post:
      consumes:
      - application/json
      description: Add New Torrent
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schema.AddNewTorrentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schema.AddNewTorrentRequest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Add Torrent
      tags:
      - QBittorrent
  /qbittorrent/add/episode:
    post:
      consumes:
      - application/json
      description: Add New Torrent
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schema.AddNewTorrentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
