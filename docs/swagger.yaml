definitions:
  schemas.AddAnimeToListRequest:
    properties:
      id:
        type: string
    type: object
  schemas.AddAnimeToListResponse:
    properties:
      media:
        items:
          properties:
            description:
              type: string
            episodes:
              type: integer
            genres:
              items:
                type: string
              type: array
            nextAiringEpisode:
              properties:
                airingAt:
                  type: string
                episode:
                  type: string
              type: object
            title:
              properties:
                english:
                  type: string
                romaji:
                  type: string
              type: object
          type: object
        type: array
    type: object
  schemas.AddIndexerRequest:
    properties:
      id:
        type: string
    type: object
  schemas.AnimeGetInfoByIdRequest:
    properties:
      id:
        type: string
    type: object
  schemas.AnimeGetInfoByIdResponse:
    properties:
      data:
        properties:
          page:
            properties:
              media:
                items:
                  properties:
                    description:
                      type: string
                    episodes:
                      type: integer
                    genres:
                      items:
                        type: string
                      type: array
                    nextAiringEpisode:
                      properties:
                        airingAt: {}
                        episode: {}
                      type: object
                    title:
                      properties:
                        english:
                          type: string
                        romaji:
                          type: string
                      type: object
                  type: object
                type: array
            type: object
        type: object
    type: object
  schemas.AnimeTitleIdByNameRequest:
    properties:
      name:
        type: string
    type: object
  schemas.AnimeTitleIdByNameResponse:
    properties:
      data:
        properties:
          Page:
            properties:
              media:
                items:
                  properties:
                    id:
                      type: integer
                    title:
                      properties:
                        english:
                          type: string
                        romaji:
                          type: string
                      type: object
                  type: object
                type: array
            type: object
        type: object
    type: object
  schemas.DefaultResponse:
    properties:
      data: {}
      message:
        type: string
    type: object
  schemas.DeleteAnimeRequest:
    properties:
      id:
        type: string
    type: object
  schemas.ErrorResponse:
    properties:
      errorCode:
        type: string
      message:
        type: string
    type: object
  schemas.IndexerResponse:
    properties:
      definitionName:
        type: string
      enable:
        type: boolean
      id:
        type: integer
      indexerUrls:
        items:
          type: string
        type: array
      language:
        type: string
      name:
        type: string
    type: object
  schemas.RemoveIndexerRequest:
    properties:
      id:
        type: string
    type: object
