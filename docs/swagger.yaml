basePath: /api/v1
definitions:
  dtos.AnimeDto:
    properties:
      bannerImage:
        type: string
      coverImage:
        properties:
          extraLarge:
            type: string
        type: object
      description:
        type: string
      episodes:
        type: integer
      genres:
        items:
          type: string
        type: array
      id:
        type: integer
      nextAiringEpisode:
        properties:
          airingAt:
            type: integer
          episode:
            type: integer
        type: object
      relations:
        properties:
          edges:
            items:
              properties:
                id:
                  type: integer
                node:
                  properties:
                    episodes:
                      type: integer
                    format:
                      type: string
                    id:
                      type: integer
                    status:
                      type: string
                    title:
                      properties:
                        english:
                          type: string
                        romaji:
                          type: string
                      type: object
                  type: object
                relationType:
                  type: string
              type: object
            type: array
        type: object
      status:
        type: string
      title:
        properties:
          english:
            type: string
          romaji:
            type: string
        type: object
    type: object
  schema.AddNewTorrentRequest:
    properties:
      magneticUrl:
        type: string
    type: object
  schema.AnimeGetInfoByIdRequest:
    properties:
      id:
        type: integer
    type: object
  schema.AnimeTitleIdByNameRequest:
    properties:
      name:
        type: string
    type: object
  schema.AnimeTitleIdByNameResponse:
    properties:
      data:
        properties:
          Page:
            properties:
              media:
                items:
                  properties:
                    id:
                      type: integer
                    title:
                      properties:
                        english:
                          type: string
                        romaji:
                          type: string
                      type: object
                  type: object
                type: array
            type: object
        type: object
    type: object
  schema.CheckTorrentRequest:
    properties:
      filter:
        type: string
    type: object
  schema.CheckTorrentResponse:
    properties:
      completed:
        type: integer
      completedon:
        type: integer
      contentpath:
        type: string
      dlspeed:
        type: integer
      eta:
        type: integer
      hash:
        type: string
      name:
        type: string
      num_leechs:
        type: integer
      num_seeds:
        type: integer
      progress:
        type: number
      save_path:
        type: string
      state:
        type: string
      time_active:
        type: integer
      upspeed:
        type: integer
    type: object
  schema.IndexerResponse:
    properties:
      definitionName:
        type: string
      enable:
        type: boolean
      id:
        type: integer
      indexerUrls:
        items:
          type: string
        type: array
      language:
        type: string
      name:
        type: string
    type: object
  schema.SearchRequest:
    properties:
      query:
        type: string
    type: object
  schema.SearchResponse:
    properties:
      age:
        type: number
      ageHours:
        type: number
      ageMinutes:
        type: number
      fileName:
        type: string
      guid:
        type: string
      indexer:
        type: string
      indexerId:
        type: integer
      infoHash:
        type: string
      infoUrl:
        type: string
      leechers:
        type: integer
      magnetUrl:
        type: string
      protocol:
        type: string
      publishDate:
        type: string
      seeders:
        type: integer
      size:
        type: integer
      title:
        type: string
    type: object
  schemas.DefaultResponse:
    properties:
      data: {}
      message:
        type: string
    type: object
  schemas.ErrorResponse:
    properties:
      errorCode:
        type: string
      message:
        type: string
    type: object
  schemas.IdRequest:
    properties:
      id:
        type: integer
    type: object
info:
  contact:
    email: julianosgreg@gmail.com
    name: Jusoares
  description: Anime download manager API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Gongon
  version: "0.1"
paths:
  /anilist:
    post:
      consumes:
      - application/json
      description: Search anime by name
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schema.AnimeTitleIdByNameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schema.AnimeTitleIdByNameResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Find Anime by name
      tags:
      - Anilist
  /anilist/get-info:
    post:
      consumes:
      - application/json
      description: Search anime info by id
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schema.AnimeGetInfoByIdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.AnimeDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Get Anime info By id
      tags:
      - Anilist
  /database/anime:
    delete:
      description: Delete Anime from List
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.IdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Delete Anime
      tags:
      - Database/Anime
    get:
      description: List all animes
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: List Animes
      tags:
      - Database/Anime
    post:
      consumes:
      - application/json
      description: Add anime to list
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.IdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Add Anime
      tags:
      - Database/Anime
  /database/indexer:
    delete:
      description: Delete Indexer from db
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.IdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Delete Indexer
      tags:
      - Database/Indexer
    get:
      description: List all added indexers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: List Indexers
      tags:
      - Database/Indexer
    post:
      consumes:
      - application/json
      description: Add Indexer to db
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.IdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Add Indexer
      tags:
      - Database/Indexer
  /database/indexer/{id}:
    get:
      description: Get indexer
      parameters:
      - description: Indexer identification
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DefaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Get Indexer
      tags:
      - Database/Indexer
  /prowlarr/indexer:
    get:
      consumes:
      - application/json
      description: Get All Prowlarr indexers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/schema.IndexerResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Get All Indexer
      tags:
      - Prowlarr/Indexer
  /prowlarr/search:
    post:
      description: Search animes on prowlarr indexers
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schema.SearchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/schema.SearchResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Search Animes
      tags:
      - Prowlarr/Search
  /qbittorrent/add:
    post:
      consumes:
      - application/json
      description: Add New Torrent
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schema.AddNewTorrentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schema.AddNewTorrentRequest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Add Torrent
      tags:
      - QBittorrent
  /qbittorrent/info:
    get:
      consumes:
      - application/json
      description: Check torrent info
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schema.CheckTorrentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schema.CheckTorrentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Check Torrent info
      tags:
      - QBittorrent
swagger: "2.0"
